{% extends "auth_base.html" %}
{% block title %}Reset password · Brightloop{% endblock %}
{% block auth %}
<div class="card auth-card p-4">
  <h1 class="h4 mb-2">Reset your password</h1>
  <p class="text-muted small">Enter the email you registered with and we'll send you a reset link.</p>
  <form method="post" novalidate>
    {% csrf_token %}
    {% include "partials/form_fields.html" %}
    <button class="btn btn-primary w-100">Send reset link</button>
  </form>
  <div class="mt-3 small"><a href="{% url 'accounts:login' %}">Back to sign in</a></div>
</div>
{% endblock %}
