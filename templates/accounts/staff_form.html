{% extends "base.html" %}
{% block title %}Add staff · Brightloop{% endblock %}
{% block content %}
<h1 class="page-title">Add staff member</h1>
<div class="card p-4" style="max-width: 520px">
  <form method="post" novalidate>
    {% csrf_token %}
    {% include "partials/form_fields.html" %}
    <button class="btn btn-primary">Create staff account</button>
    <a class="btn btn-link" href="{% url 'accounts:staff_list' %}">Cancel</a>
  </form>
</div>
{% endblock %}
